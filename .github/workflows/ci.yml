name: ci

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  static:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - run: bash scripts/ci/secret-scan.sh
      - run: bash scripts/ci/docs-check.sh
      - run: python3 scripts/ci/workflow-lint.py
      - run: bash scripts/ci/egress-check.sh
      - run: bash scripts/ci/presets-onion-check.sh
      - run: bash scripts/ci/policy-check.sh

  android-foss-debug:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3
        with:
          distribution: temurin
          java-version: "17"
      - name: Android SDK components
        run: |
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses >/dev/null || true
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "platforms;android-35" "build-tools;35.0.0" "ndk;23.1.7779620"
          printf 'sdk.dir=%s\n' "$ANDROID_HOME" > apps/multiplatform/local.properties
      - name: Native libs (interim, checksum-verified upstream release)
        env:
          GH_TOKEN: ${{ github.token }}
        run: bash scripts/ci/fetch-native-libs.sh
      - name: assembleFossDebug (arm64-v8a)
        working-directory: apps/multiplatform
        env:
          JAVA_TOOL_OPTIONS: -Duser.language=en -Duser.country=US
        run: ./gradlew assembleFossDebug :android:testFossDebugUnitTest :common:testDebugUnitTest --tests 'chat.simplex.app.VeilNetworkPolicyTest' -Pveil.abis=arm64-v8a --console=plain
      - name: Summary (what ran and what did not)
        if: always()
        run: |
          {
            echo "### Veil CI status"
            echo "- RAN: secret scan, docs check, workflow lint (job static); FOSS debug build and unit tests (this job)"
            echo "- NOT RUN: lint, armeabi-v7a, native core build from source, third-party license inventory, instrumented and real-device tests"
          } >> "$GITHUB_STEP_SUMMARY"
